spring.application.name=SmartLeaveManagement
server.port=8080

# MySQL Database
spring.datasource.url=jdbc:mysql://localhost:3306/smart_leave_db
spring.datasource.username=root
spring.datasource.password=MySQL@315
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# JPA and Hibernate
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect
spring.jackson.serialization.indent-output=true

# JWT Authentication
app.jwt.secret=${JWT_SECRET}
app.jwt.expiration=86400000

# Gmail SMTP Configuration
spring.mail.host=smtp.gmail.com
spring.mail.port=587
spring.mail.username=${MAIL_USERNAME:}
spring.mail.password=${MAIL_PASSWORD:}

# SMTP Properties
spring.mail.properties[mail.smtp.auth]=true
spring.mail.properties[mail.smtp.starttls.enable]=true
spring.mail.properties[mail.smtp.starttls.required]=true
spring.mail.properties[mail.smtp.connectiontimeout]=5000
spring.mail.properties[mail.smtp.timeout]=5000
spring.mail.properties[mail.smtp.writetimeout]=5000

# Email Settings
app.mail.enabled=${MAIL_ENABLED:false}
app.mail.from=${MAIL_FROM:}

# Initial HR Account Bootstrap
app.bootstrap.hr.enabled=${BOOTSTRAP_HR_ENABLED:false}
app.bootstrap.hr.name=${BOOTSTRAP_HR_NAME:}
app.bootstrap.hr.email=${BOOTSTRAP_HR_EMAIL:}
app.bootstrap.hr.password=${BOOTSTRAP_HR_PASSWORD:}

# Security Debug Logging
logging.level.org.springframework.security=TRACE
logging.level.com.smartleave.backend.security=DEBUG

# Application Logging
logging.level.com.smartleave.backend=DEBUG
